<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Your Letter Reveal account." />
  <title>Account · Letter Reveal</title>
  <link rel="stylesheet" href="account.css?v=local-account-20261025" />
</head>
<body>
  <main class="account-page">
    <a class="back-link" href="../">← Letter Reveal</a>

    <section class="account-card" aria-labelledby="accountTitle">
      <h1 id="accountTitle">Your account</h1>
      <p class="intro">Keep your scores under one username on this browser.</p>

      <div class="signed-in" id="signedIn" hidden>
        <span>Signed in as</span>
        <strong id="currentUsername"></strong>
        <a class="primary-link" href="../">Play today’s puzzle</a>
        <button class="plain-button" id="signOutButton" type="button">Sign out</button>
      </div>

      <form id="accountForm">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" minlength="3" maxlength="20" pattern="[A-Za-z0-9_-]+" autocomplete="username" autocapitalize="none" spellcheck="false" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="current-password" required />

        <div class="account-actions">
          <button class="primary-button" type="submit">Sign in</button>
          <button class="secondary-button" id="createButton" type="button">Create account</button>
        </div>
      </form>

      <p class="status" id="accountStatus" role="status" aria-live="polite"></p>
      <p class="storage-note">Saved only on this device for now. Clearing browser data removes the account and scores.</p>
    </section>
  </main>

  <script type="module" src="account.js?v=local-account-20261025"></script>
</body>
</html>
