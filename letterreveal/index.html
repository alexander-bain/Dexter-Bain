<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="A daily fifteen-letter phrase game." />
  <title>Letter Reveal</title>
  <link rel="stylesheet" href="styles.css?v=whole-guess-wrong-20261025" />
</head>
<body>
  <main class="game" aria-label="Letter Reveal daily game">
    <section class="letter-table known-table" aria-labelledby="knownLabel">
      <div class="hint-heading">
        <span>Hint</span>
        <h1 id="hintText">Loading today’s hint…</h1>
      </div>
      <div class="known-heading">
        <h2 id="knownLabel">Letters you know</h2>
        <span id="knownValue">1 / 15</span>
      </div>
      <div class="letter-board" id="knownBoard" aria-label="Revealed letters"></div>
    </section>

    <button class="reveal-button" id="revealButton" type="button">
      <span>Reveal letter</span>
      <small id="creditsValue">10 left</small>
    </button>

    <section class="letter-table" aria-labelledby="guessLabel">
      <div class="table-heading compact-heading">
        <h2 id="guessLabel">Your guess</h2>
        <span id="guessStatus" role="status" aria-live="polite"></span>
      </div>
      <div class="letter-board" id="guessBoard" aria-label="Your phrase guess"></div>
    </section>

    <div class="keypad" id="keypad" aria-label="Letter keypad">
      <div class="key-row">
        <button type="button" data-key="Q">Q</button>
        <button type="button" data-key="W">W</button>
        <button type="button" data-key="E">E</button>
        <button type="button" data-key="R">R</button>
        <button type="button" data-key="T">T</button>
        <button type="button" data-key="Y">Y</button>
        <button type="button" data-key="U">U</button>
        <button type="button" data-key="I">I</button>
        <button type="button" data-key="O">O</button>
        <button type="button" data-key="P">P</button>
      </div>
      <div class="key-row middle-row">
        <button type="button" data-key="A">A</button>
        <button type="button" data-key="S">S</button>
        <button type="button" data-key="D">D</button>
        <button type="button" data-key="F">F</button>
        <button type="button" data-key="G">G</button>
        <button type="button" data-key="H">H</button>
        <button type="button" data-key="J">J</button>
        <button type="button" data-key="K">K</button>
        <button type="button" data-key="L">L</button>
      </div>
      <div class="key-row last-row">
        <button type="button" data-key="Z">Z</button>
        <button type="button" data-key="X">X</button>
        <button type="button" data-key="C">C</button>
        <button type="button" data-key="V">V</button>
        <button type="button" data-key="B">B</button>
        <button type="button" data-key="N">N</button>
        <button type="button" data-key="M">M</button>
        <button class="reset-key" type="button" data-key="RESET" aria-label="Reset guess">Reset</button>
        <button class="delete-key" type="button" data-key="DELETE" aria-label="Delete">Delete</button>
      </div>
    </div>

    <section class="score-chart" id="scoreChart" aria-labelledby="scoreTitle" hidden>
      <div class="score-heading">
        <h2 id="scoreTitle">Your score</h2>
        <strong id="scoreValue"></strong>
      </div>
      <div class="score-bars" id="scoreBars" aria-label="Past score distribution"></div>
      <p id="scoreNote"></p>
    </section>

    <a class="account-link" id="accountLink" href="account/">Account</a>
  </main>

  <script type="module" src="app.js?v=whole-guess-wrong-20261025"></script>
</body>
</html>
