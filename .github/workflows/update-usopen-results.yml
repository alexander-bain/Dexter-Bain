name: Update US Open results

on:
  schedule:
    - cron: "*/5 * 30-31 8 *"
    - cron: "*/5 * 1-13 9 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-usopen-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check tournament window
        id: window
        run: |
          today="$(date -u +%Y%m%d)"
          if [ "$today" -ge 20260830 ] && [ "$today" -le 20260913 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out main
        if: steps.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        if: steps.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch completed matches
        if: steps.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/update-usopen-results.mjs

      - name: Test result mapping
        if: steps.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/test-usopen-live-results.mjs

      - name: Publish changed results
        if: steps.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- usopen/data; then
            echo "No new completed matches."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usopen/data/men.json usopen/data/women.json usopen/data/results.json
          git commit -m "Update US Open results"
          git pull --rebase origin main
          git push origin HEAD:main
