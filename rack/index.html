<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123f31" />
    <meta
      name="description"
      content="Play Rack Royale with friends in a private room or face up to three AI opponents."
    />
    <meta property="og:title" content="Rack Royale — Play Online" />
    <meta
      property="og:description"
      content="Create a private room, invite friends, or play the classic tile game against AI."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dexterbain.com/rack/" />
    <meta property="og:image" content="https://rack-royale.dexterhbain.chatgpt.site/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://dexterbain.com/rack/" />
    <link rel="icon" href="https://rack-royale.dexterhbain.chatgpt.site/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./rack.css" />
    <title>Rack Royale — Play Online</title>
  </head>
  <body>
    <main class="game-shell">
      <div class="loading-screen" id="loading-screen" role="status" aria-live="polite">
        <div class="tile-mark" aria-hidden="true">
          <span class="tile tile-red">7</span>
          <span class="tile tile-blue">8</span>
          <span class="tile tile-black">9</span>
          <span class="tile tile-orange">10</span>
        </div>
        <h1>Rack Royale</h1>
        <p id="loading-message">Setting the tiles…</p>
        <a
          class="fallback-link"
          id="fallback-link"
          href="https://rack-royale.dexterhbain.chatgpt.site/"
        >Open the game directly</a>
      </div>

      <iframe
        id="rack-game"
        title="Rack Royale online tile game"
        allow="clipboard-write; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </main>

    <noscript>
      <p class="no-script">
        JavaScript is needed to play.
        <a href="https://rack-royale.dexterhbain.chatgpt.site/">Open Rack Royale</a>.
      </p>
    </noscript>
    <script src="./rack.js"></script>
  </body>
</html>
