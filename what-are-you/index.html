<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Character Check has moved</title>
    <link rel="canonical" href="https://dexterbain.com/charactercheck/" />
    <script>
      (() => {
        const destination = new URL("../charactercheck/", window.location.href);
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination);
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=../charactercheck/" />
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: #10111a;
        background: #f6f1e8;
        font: 700 18px/1.5 system-ui, sans-serif;
      }

      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <p>Character Check moved. <a href="../charactercheck/">Play at the new address</a>.</p>
  </body>
</html>
