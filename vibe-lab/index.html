<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Describe a game idea. Turn it into a clean Codex prompt."
    />
    <meta name="theme-color" content="#f4f6f8" />
    <title>Dexter's Vibe Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="lab">
      <div class="brand" aria-label="Dexter's Vibe Lab">
        <span class="brand-mark" aria-hidden="true">D</span>
        <h1>Dexter's Vibe Lab</h1>
      </div>

      <form class="chatbar" id="ideaForm">
        <label class="sr-only" for="ideaInput">Describe your game idea</label>
        <textarea
          id="ideaInput"
          name="idea"
          rows="1"
          maxlength="2000"
          placeholder="Describe the game you want to make..."
          autocomplete="off"
          required
        ></textarea>
        <button class="send-button" type="submit" aria-label="Create prompt" title="Create prompt">
          <span aria-hidden="true">↑</span>
        </button>
      </form>
    </main>

    <dialog class="prompt-dialog" id="promptDialog">
      <div class="dialog-header">
        <h2>Your Codex prompt</h2>
        <button class="close-button" id="closeDialog" type="button" aria-label="Close" title="Close">
          ×
        </button>
      </div>
      <textarea
        class="prompt-output"
        id="generatedPrompt"
        readonly
        aria-label="Generated Codex prompt"
      ></textarea>
      <button class="copy-button" id="copyPrompt" type="button">Copy Prompt</button>
      <p class="review-note">Games are reviewed before publishing.</p>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
  </body>
</html>
