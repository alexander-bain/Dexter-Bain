    </g>
    <g transform="translate(352 340) rotate(-9 55 55)">
      <rect width="110" height="110" rx="28" fill="#8f76ff"/>
      <circle cx="32" cy="31" r="8" fill="#fff"/><circle cx="78" cy="31" r="8" fill="#fff"/><circle cx="32" cy="55" r="8" fill="#fff"/><circle cx="78" cy="55" r="8" fill="#fff"/><circle cx="32" cy="79" r="8" fill="#fff"/><circle cx="78" cy="79" r="8" fill="#fff"/>
