<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">One in a Million game icon</title>
  <desc id="desc">Six colorful dice surrounding a glowing number one.</desc>
  <defs>
    <linearGradient id="bg" x1="30" y1="20" x2="470" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2c1468"/>
      <stop offset=".48" stop-color="#11113d"/>
      <stop offset="1" stop-color="#081e34"/>
    </linearGradient>
    <linearGradient id="one" x1="180" y1="90" x2="335" y2="415" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7a6"/>
      <stop offset=".45" stop-color="#55ecff"/>
      <stop offset="1" stop-color="#ff69a1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".4"/></filter>
  </defs>
