  <circle cx="257" cy="254" r="197" fill="none" stroke="#ffda5b" stroke-opacity=".09" stroke-width="2" stroke-dasharray="7 13"/>
  <g filter="url(#shadow)">
    <g transform="translate(72 67) rotate(-12 55 55)">
      <rect width="110" height="110" rx="28" fill="#ff5d8f"/>
      <circle cx="34" cy="34" r="9" fill="#fff"/><circle cx="76" cy="76" r="9" fill="#fff"/>
    </g>
    <g transform="translate(333 53) rotate(13 53 53)">
      <rect width="106" height="106" rx="27" fill="#ffe45e"/>
      <circle cx="31" cy="31" r="8" fill="#332669"/><circle cx="75" cy="31" r="8" fill="#332669"/><circle cx="53" cy="53" r="8" fill="#332669"/><circle cx="31" cy="75" r="8" fill="#332669"/><circle cx="75" cy="75" r="8" fill="#332669"/>
    </g>
